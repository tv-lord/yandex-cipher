<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <!-- Улучшенный масштаб для мобильных телефонов -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- Ключевые слова для продвижения сайта в топы Яндекса и Google -->
    <title>Яндекс-шифр Переводчик онлайн</title>
    <meta name="description" content="Яндекс-шифр — удобный онлайн переводчик и шифратор текста по раскладке клавиатуры смартфона. Шифруй сообщения мгновенно!">
    <meta name="keywords" content="яндекс шифр, яндекс-шифр, шифр клавиатуры, зашифровать текст, клавиатурный шифр, шифратор онлайн">

    <!-- Подключение вашей крутой иконки -->
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="apple-touch-icon" href="favicon.png">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        /* Плавная анимация появления всего контента при входе */
        @keyframes AppWithHeaderAppear {
            0% { opacity: 0; transform: translateY(30px); filter: blur(8px); }
            100% { opacity: 1; transform: translateY(0); filter: blur(0); }
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: #111112; 
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        .wrapper {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: AppWithHeaderAppear 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        h2 { 
            font-size: 24px; 
            margin-bottom: 20px; 
            font-weight: 700;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        h2 span { 
            color: #f33c3c; 
            font-weight: 400; 
        } 

        .container { 
            background: #1e1e20; 
            padding: 24px; 
            border-radius: 24px; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.6); 
            width: 100%;
            border: 1px solid rgba(255,255,255,0.03);
            text-align: center;
        }

        .input-group { margin-bottom: 20px; text-align: left; }
        label { display: block; font-size: 12px; color: #8e8e93; margin-bottom: 8px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
        
        textarea { 
            width: 100%; 
            height: 100px; 
            padding: 14px; 
            border-radius: 14px; 
            border: 2px solid #2c2c2e; 
            background: #2c2c2e;
            color: #ffffff;
            font-size: 16px; 
            resize: none;
            outline: none;
            transition: border-color 0.2s, background-color 0.2s;
        }
        textarea:focus { border-color: #ffcc00; background: #323235; }
        textarea::placeholder { color: #636366; }
        
        .result-container { position: relative; width: 100%; }
        .result-box { 
            background: #151516; 
            border: 2px solid #151516; 
            padding-right: 55px; 
        }
        .result-box:focus { border-color: #2c2c2e; }

        .action-buttons {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .icon-btn {
            background: #2c2c2e;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.1s, background-color 0.2s;
        }
        .icon-btn:hover { background: #3a3a3c; }
        .icon-btn:active { transform: scale(0.9); }
        
        .icon-btn.btn-copy.active { background: #ffcc00; }
        .icon-btn.btn-copy.active svg { fill: #000000; }

        .toast {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px);
            background: #ffcc00; color: #000000; padding: 12px 24px; border-radius: 20px;
            font-size: 14px; font-weight: 600; opacity: 0; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            pointer-events: none; box-shadow: 0 10px 25px rgba(255,204,0,0.2);
        }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    </style>
</head>
<body>

<div class="wrapper">
    
    <h2>⌨️ <span>Яндекс-шифр</h2>
    
    <div class="container">
        <div class="input-group">
            <label>Ввод (текст или цифры):</label>
            <textarea id="inputText" placeholder="Начните писать текст или вставьте шифр..." oninput="autoProcess()"></textarea>
        </div>
        
        <div class="input-group">
            <label>Результат перевода:</label>
            <div class="result-container">
                <textarea id="outputText" class="result-box" placeholder="Здесь отобразится готовый результат..." readonly></textarea>
                
                <div class="action-buttons">
                    <button id="copyBtn" class="icon-btn btn-copy" onclick="copyResult()" title="Копировать">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="#8e8e93" id="copyIcon">
                            <path d="M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z" />
                        </svg>
                    </button>
                    <button class="icon-btn" onclick="clearAll()" title="Очистить">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="#ff453a">
                            <path d="M9,3V4H4V6H5V19A2,2 0 0,0 7,21H17A2,2 0 0,0 19,19V6H20V4H15V3H9M7,6H17V19H7V6M9,8V17H11V8H9M13,8V17H15V8H13Z" />
                        </svg>
                    </button>
                </div>
            </div>
        </div>

        <!-- Защитный дисклеймер аккуратно встроен в самый низ блока -->
        <p style="font-size: 11px; color: #636366; margin-top: 25px; line-height: 1.4; text-align: center; font-weight: 400;">
            Данный сайт является независимым фанатским проектом и никак не связан с компанией ООО «Яндекс». <br>
            Название шифра обусловлено использованием раскладки Яндекс Клавиатуры.
        </p>

    </div>
</div>

<div id="toast" class="toast">Текст скопирован! 📋</div>

<script>
const keys = ["Й","Ц","У","К","Е","Н","Г","Ш","Щ","З","Х","Ф","В","А","П","Р","О","Л","Д","Ж","Э","Я","Ч","С","М","И","Т","Ь","Б","Ю","Ъ"];

function autoProcess() {
    let input = document.getElementById("inputText").value.trim();
    let outputBtn = document.getElementById("copyBtn");
    
    if (input === "") {
        document.getElementById("outputText").value = "";
        outputBtn.classList.remove("active");
        return;
    }

    let hasRussianLetters = /[А-ЯЁёа-я]/i.test(input);

    if (hasRussianLetters) {
        encrypt(input);
    } else {
        decrypt(input);
    }
    
    outputBtn.classList.add("active");
}

function encrypt(text) {
    let words = text.toUpperCase().split(" ");
    let encryptedWords = [];

    for (let word of words) {
        let encryptedLetters = [];
        for (let char of word) {
            let index = keys.indexOf(char);
            if (index !== -1) {
                encryptedLetters.push(index + 1);
            } else {
                encryptedLetters.push(char);
            }
        }
        encryptedWords.push(encryptedLetters.join(","));
    }
    document.getElementById("outputText").value = encryptedWords.join("_");
}

function decrypt(text) {
    let words = text.split("_");
    let decryptedWords = [];

    for (let word of words) {
        let tokens = word.split(",");
        let decryptedLetters = [];
        for (let token of tokens) {
            let num = parseInt(token);
            if (!isNaN(num) && num >= 1 && num <= keys.length) {
                decryptedLetters.push(keys[num - 1]);
            } else {
                decryptedLetters.push(token);
            }
        }
        decryptedWords.push(decryptedLetters.join(""));
    }
    document.getElementById("outputText").value = decryptedWords.join(" ");
}

function copyResult() {
    let output = document.getElementById("outputText");
    if (output.value === "") return;
    
    navigator.clipboard.writeText(output.value).then(() => {
        let toast = document.getElementById("toast");
        toast.className = "toast show";
        setTimeout(() => { toast.className = "toast"; }, 2200);
    });
}

function clearAll() {
    document.getElementById("inputText").value = "";
    document.getElementById("outputText").value = "";
    document.getElementById("copyBtn").classList.remove("active");
}
</script>

</body>
</html>
